<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Four engineering questions: DECIDE (requirement-zero), VERIFY (fornax-core), GOVERN (agent-assembly, glomeris), PROTECT (eltanin)">

  <!-- Title -->
  <text x="380" y="18" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="2.5">THE QUESTIONS I KEEP BUILDING AROUND</text>

  <!-- Row 1: DECIDE (TL) -->
  <rect x="10" y="28" width="366" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="28" y="50" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#e2e8f0" font-weight="700" letter-spacing="1">DECIDE</text>
  <text x="28" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">should this work exist?</text>
  <text x="28" y="94" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#e2e8f0" font-weight="700">requirement-zero</text>

  <!-- Row 1: VERIFY (TR) -->
  <rect x="384" y="28" width="366" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="402" y="50" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#e2e8f0" font-weight="700" letter-spacing="1">VERIFY</text>
  <text x="402" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">what does evidence say happened?</text>
  <text x="402" y="94" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#e2e8f0" font-weight="700">fornax-core</text>

  <!-- Row 2: GOVERN (BL) -->
  <rect x="10" y="116" width="366" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="28" y="138" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#e2e8f0" font-weight="700" letter-spacing="1">GOVERN</text>
  <text x="28" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">who authorizes this, under what policy?</text>
  <text x="28" y="182" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#e2e8f0" font-weight="700">agent-assembly  ·  glomeris</text>

  <!-- Row 2: PROTECT (BR) -->
  <rect x="384" y="116" width="366" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="402" y="138" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#e2e8f0" font-weight="700" letter-spacing="1">PROTECT</text>
  <text x="402" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">which resources need authorization to use?</text>
  <text x="402" y="182" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#e2e8f0" font-weight="700">eltanin</text>

</svg>
